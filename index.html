<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <title>Pháo hoa thành phố đêm nhiều kiểu</title>
  <style>
    body { margin:0; background:#000; overflow:hidden; }
    canvas { display:block; }
  </style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
let W,H;
function rand(a,b){ return a+Math.random()*(b-a); }
function pick(arr){ return arr[(Math.random()*arr.length)|0]; }
const colors=["#ff595e","#ffca3a","#8ac926","#1982c4","#6a4c93","#ff006e","#00f5d4","#ffd166"];
const styles=["circle","heart","spiral","random"];

const rockets=[], particles=[], buildings=[], stars=[];
const gravity=0.05;

// Khởi tạo nhà
function initBuildings(){
  const groundHeight = H*0.2;
  const buildingCount = 15;
  buildings.length = 0;
  for(let i=0;i<buildingCount;i++){
    const bw = rand(40,80);
    const bh = rand(60,groundHeight);
    const bx = i*(W/buildingCount);
    const by = H-bh;
    const windows = [];
    for(let r=10;r<bh;r+=20){
      for(let c=5;c<bw;c+=20){
        if(Math.random()<0.3){
          windows.push({x:bx+c,y:by+r});
        }
      }
    }
    buildings.push({x:bx,y:by,w:bw,h:bh,windows});
  }
}

// Khởi tạo sao
function initStars(){
  stars.length=0;
  for(let i=0;i<80;i++){
    stars.push({
      x:rand(0,W),
      y:rand(0,H*0.6),
      r:rand(1,2),
      alpha:rand(0.5,1)
    });
  }
}

function resize(){
  W=canvas.width=window.innerWidth;
  H=canvas.height=window.innerHeight;
  initBuildings();
  initStars();
}
resize(); window.onresize=resize;

function spawnRocket(){
  const x=rand(50,W-50);
  rockets.push({
    x,y:H,
    vx:rand(-1,1),
    vy:rand(-8,-11),
    exploded:false,
    targetY:rand(H*0.2,H*0.5),
    style:pick(styles)
  });
}

function explode(r){
  const count=80;
  const style=r.style;
  for(let i=0;i<count;i++){
    let vx,vy;
    if(style==="circle"){
      const a=(i/count)*Math.PI*2;
      const speed=rand(2,4);
      vx=Math.cos(a)*speed; vy=Math.sin(a)*speed;
    } else if(style==="heart"){
      const t=(i/count)*Math.PI*2;
      const x=16*Math.pow(Math.sin(t),3);
      const y=-(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t));
      vx=x*0.2; vy=y*0.2;
    } else if(style==="spiral"){
      const a=(i/count)*Math.PI*6;
      const speed=0.1*i;
      vx=Math.cos(a)*speed; vy=Math.sin(a)*speed;
    } else { // random
      const a=Math.random()*Math.PI*2;
      const speed=rand(2,5);
      vx=Math.cos(a)*speed; vy=Math.sin(a)*speed;
    }
    particles.push({
      x:r.x,y:r.y,
      vx,vy,
      alpha:1,
      decay:rand(0.01,0.02),
      color:pick(colors)
    });
  }
}

function update(){
  for(let i=rockets.length-1;i>=0;i--){
    const r=rockets[i];
    r.vy+=gravity*0.5;
    r.x+=r.vx; r.y+=r.vy;
    if(!r.exploded && r.y<=r.targetY){
      r.exploded=true; explode(r);
      rockets.splice(i,1);
    }
    if(r.y>H) rockets.splice(i,1);
  }
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];
    p.vy+=gravity;
    p.x+=p.vx; p.y+=p.vy;
    p.alpha-=p.decay;
    if(p.alpha<=0) particles.splice(i,1);
  }
}

function drawBackground(){
  ctx.fillStyle="rgba(0,0,0,0.2)";
  ctx.fillRect(0,0,W,H);

  // Sao
  for(const s of stars){
    ctx.globalAlpha=s.alpha;
    ctx.fillStyle="#fff";
    ctx.beginPath();
    ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
    ctx.fill();
  }
  ctx.globalAlpha=1;

  // Mặt trăng
  ctx.fillStyle="#fdf5e6";
  ctx.beginPath();
  ctx.arc(W*0.8,H*0.2,40,0,Math.PI*2);
  ctx.fill();

  // Nhà
  const groundHeight = H*0.2;
  ctx.fillStyle="#111";
  ctx.fillRect(0,H-groundHeight,W,groundHeight);
  for(const b of buildings){
    ctx.fillStyle="#222";
    ctx.fillRect(b.x,b.y,b.w,b.h);
    ctx.fillStyle="#ffd700";
    for(const w of b.windows){
      ctx.fillRect(w.x,w.y,6,8);
    }
  }
}

function draw(){
  drawBackground();
  for(const r of rockets){
    ctx.fillStyle="#fff";
    ctx.beginPath(); ctx.arc(r.x,r.y,3,0,Math.PI*2); ctx.fill();
  }
  for(const p of particles){
    ctx.globalAlpha=p.alpha;
    ctx.fillStyle=p.color;
    ctx.beginPath(); ctx.arc(p.x,p.y,2,0,Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha=1;
}

function loop(){ update(); draw(); requestAnimationFrame(loop); }
loop();

// Tự động bắn pháo hoa
setInterval(spawnRocket,160);
</script>
</body>
</html>
